spring.application.name=order-service

server.port=8080

# ===================== Kafka =====================
# Where the broker lives (matches docker-compose advertised listener).
spring.kafka.bootstrap-servers=localhost:9092

# ---- Producer: we send Java objects as JSON ----
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Don't stamp our concrete class name into the message header — the other service has its own
# event class in a different package. Consumers map JSON->their own type by field names instead.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ---- Consumer: order-service also listens to the "order-placed" topic ----
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Deserialize incoming JSON into our own event classes; trust the event package.
spring.kafka.consumer.properties.spring.json.trusted.packages=ecom.microservices.*
# The producer stamps a type header; if it's missing/foreign, fall back to this type.
spring.kafka.consumer.properties.spring.json.value.default.type=ecom.microservices.order_service.event.OrderPlacedEvent

# ---- Topic names (referenced from code) ----
app.kafka.topic.payment-completed=payment-completed
app.kafka.topic.order-placed=order-placed
